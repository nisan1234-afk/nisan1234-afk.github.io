<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>כיתה פלוס</title>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --blue: #3B82F6; --blue-light: #93C5FD;
      --dark: #0A0F1E; --dark2: #111827; --dark3: #1F2937;
      --text: #F9FAFB; --muted: #9CA3AF;
      --teal: #14B8A6; --purple: #8B5CF6; --purple-light: #A78BFA;
    }
    body {
      font-family: 'Heebo', sans-serif; background: var(--dark); color: var(--text);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .wrap { max-width: 480px; width: 100%; text-align: center; }
    .logo {
      font-size: 32px; font-weight: 800; margin-bottom: 8px;
      background: linear-gradient(135deg, var(--blue-light), var(--purple-light));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .tagline { font-size: 14px; color: var(--muted); margin-bottom: 48px; }
    .choices { display: flex; flex-direction: column; gap: 16px; }
    .choice-card {
      display: flex; align-items: center; gap: 16px; padding: 22px 24px;
      background: var(--dark2); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px;
      text-decoration: none; color: var(--text); transition: all 0.2s; text-align: right;
    }
    .choice-card:hover { border-color: rgba(59,130,246,0.4); transform: translateY(-2px); box-shadow: 0 12px 32px rgba(0,0,0,0.35); }
    .choice-icon { font-size: 32px; flex-shrink: 0; }
    .choice-title { font-size: 17px; font-weight: 700; }
    .choice-desc { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .choice-arrow { margin-inline-start: auto; font-size: 20px; color: var(--muted); }
  </style>
</head>
<body>

<div class="wrap">
  <div class="logo">כיתה פלוס</div>
  <div class="tagline">מערכת ניהול למידה — ישיבת אלוני הבשן</div>

  <div class="choices">
    <a class="choice-card" href="https://nisan1234-afk.github.io/TICHER/">
      <div class="choice-icon">🎓</div>
      <div>
        <div class="choice-title">אני תלמיד/ה</div>
        <div class="choice-desc">כניסה עם חשבון Google של בית הספר</div>
      </div>
      <div class="choice-arrow">←</div>
    </a>

    <a class="choice-card" href="https://nisan1234-afk.github.io/TICHER/">
      <div class="choice-icon">🧑‍🏫</div>
      <div>
        <div class="choice-title">אני מורה</div>
        <div class="choice-desc">כניסה עם חשבון Google</div>
      </div>
      <div class="choice-arrow">←</div>
    </a>
  </div>
</div>

</body>
</html>
