<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>כיתה פלוס</title>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;800&family=Rubik:wght@500;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --blue: #3FA7FF; --blue-light: #8FCBFF;
      --dark: #0A1622; --dark2: #0F2135; --dark3: #16293D;
      --text: #F3F7FA; --muted: #90A6BA;
      --teal: #17BFA6; --purple: #9B6BF0; --purple-light: #B79CFF;
      --gold: #F2C94C; --warning: #F2994A;
      --font-display: 'Rubik', 'Heebo', sans-serif;
    }
    body {
      font-family: 'Heebo', sans-serif; background: var(--dark); color: var(--text);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px;
      background-image:
        radial-gradient(ellipse 900px 600px at 100% -10%, rgba(63,167,255,0.14), transparent 60%),
        radial-gradient(ellipse 700px 600px at -10% 110%, rgba(242,153,74,0.10), transparent 60%),
        radial-gradient(circle, rgba(255,255,255,0.035) 1px, transparent 1px);
      background-size: auto, auto, 26px 26px;
    }
    .wrap { max-width: 460px; width: 100%; text-align: center; }
    .brand-mark {
      width: 56px; height: 56px; border-radius: 16px; margin: 0 auto 18px;
      background: linear-gradient(135deg, var(--blue), var(--teal));
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 24px rgba(63,167,255,0.35);
    }
    .brand-mark svg { width: 30px; height: 30px; }
    .logo {
      font-family: var(--font-display); font-size: 30px; font-weight: 800; letter-spacing: -0.01em; margin-bottom: 8px;
      background: linear-gradient(135deg, var(--blue-light), var(--purple-light));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .tagline { font-size: 13px; font-weight: 600; color: var(--teal); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 44px; }
    .choices { display: flex; flex-direction: column; gap: 16px; }
    .choice-card {
      position: relative;
      display: flex; align-items: center; gap: 16px; padding: 22px 24px;
      background: linear-gradient(160deg, var(--dark3), var(--dark2) 80%);
      border: 1px solid rgba(255,255,255,0.08); border-radius: 18px;
      text-decoration: none; color: var(--text); transition: all 0.25s; text-align: right;
      overflow: hidden;
    }
    .choice-card::before {
      content: ''; position: absolute; inset-inline-start: 0; top: 0; bottom: 0; width: 4px;
      background: var(--card-accent, var(--teal)); opacity: 0; transition: opacity 0.25s;
    }
    .choice-card:hover { border-color: rgba(255,255,255,0.18); transform: translateY(-3px); box-shadow: 0 16px 36px rgba(0,0,0,0.4); }
    .choice-card:hover::before { opacity: 1; }
    .choice-icon {
      width: 48px; height: 48px; flex-shrink: 0; border-radius: 13px;
      display: flex; align-items: center; justify-content: center; font-size: 24px;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08);
    }
    .choice-title { font-family: var(--font-display); font-size: 17px; font-weight: 700; }
    .choice-desc { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .choice-arrow { margin-inline-start: auto; font-size: 18px; color: var(--muted); transition: transform 0.25s; }
    .choice-card:hover .choice-arrow { transform: translateX(-4px); color: var(--text); }
    .footnote { margin-top: 36px; font-size: 11px; color: var(--muted); }

    /* מיקרו-אינטראקציות: פידבק מיידי בלחיצה */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition-duration: 0.01ms !important; }
    }
    .choice-card:active { transform: translateY(-1px) scale(0.98); }

    /* רגע חתימה: וילון + מטוס ממריא — פעם אחת בכל סשן בלבד */
    .intro-overlay { position: fixed; inset: 0; z-index: 1000; }
    .curtain { position: fixed; top: 0; bottom: 0; width: 50%; background: var(--dark); z-index: 1001; }
    .curtain-left  { left: 0; }
    .curtain-right { right: 0; }
    .intro-overlay.opening .curtain-left  { animation: curtainOpenLeft 0.8s cubic-bezier(.65,0,.35,1) forwards; animation-delay: 0.55s; }
    .intro-overlay.opening .curtain-right { animation: curtainOpenRight 0.8s cubic-bezier(.65,0,.35,1) forwards; animation-delay: 0.55s; }
    @keyframes curtainOpenLeft  { to { transform: translateX(-100%); } }
    @keyframes curtainOpenRight { to { transform: translateX(100%); } }
    .intro-plane {
      position: fixed; top: 55%; right: 0; width: 44px; height: 44px; z-index: 1002; opacity: 0;
      transform: translateX(120vw) rotate(-15deg);
    }
    .intro-plane svg { width: 100%; height: 100%; }
    .intro-overlay.opening .intro-plane { animation: introPlaneFly 1s cubic-bezier(.3,0,.2,1) forwards; animation-delay: 0.1s; }
    @keyframes introPlaneFly {
      0%   { opacity: 0; transform: translateX(120vw) translateY(0) rotate(-15deg) scale(0.85); }
      12%  { opacity: 1; }
      85%  { opacity: 1; }
      100% { opacity: 0; transform: translateX(-130vw) translateY(-40px) rotate(-15deg) scale(1.05); }
    }
  </style>
</head>
<body>

<div class="wrap">
  <div class="brand-mark">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2.5 13.5L21 4L14 20.5L11.2 12.8L2.5 13.5Z" fill="white" fill-opacity="0.92"/></svg>
  </div>
  <div class="logo">כיתה פלוס</div>
  <div class="tagline">מערכת ניהול למידה · ישיבת אלוני הבשן</div>

  <div class="choices">
    <a class="choice-card" href="https://nisan1234-afk.github.io/TICHER/" style="--card-accent: var(--teal);">
      <div class="choice-icon">🎓</div>
      <div>
        <div class="choice-title">אני תלמיד/ה</div>
        <div class="choice-desc">כניסה עם חשבון Google של בית הספר</div>
      </div>
      <div class="choice-arrow">←</div>
    </a>

    <a class="choice-card" href="https://nisan1234-afk.github.io/TICHER/" style="--card-accent: var(--blue);">
      <div class="choice-icon">🧑‍🏫</div>
      <div>
        <div class="choice-title">אני מורה</div>
        <div class="choice-desc">כניסה עם חשבון Google</div>
      </div>
      <div class="choice-arrow">←</div>
    </a>
  </div>

  <div class="footnote">✈️ תיירות דיגיטלית · ועוד מגמות בדרך</div>
</div>

<div class="intro-overlay" id="introOverlay" aria-hidden="true">
  <div class="curtain curtain-left"></div>
  <div class="curtain curtain-right"></div>
  <div class="intro-plane">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2.5 13.5L21 4L14 20.5L11.2 12.8L2.5 13.5Z" fill="white"/></svg>
  </div>
</div>

<script>
(function () {
  var overlay = document.getElementById('introOverlay');
  var seenThisSession = sessionStorage.getItem('kpIntroShown');
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!overlay) return;
  if (seenThisSession || reduceMotion) { overlay.remove(); return; }
  sessionStorage.setItem('kpIntroShown', '1');
  document.body.style.overflow = 'hidden';
  requestAnimationFrame(function () { overlay.classList.add('opening'); });
  setTimeout(function () {
    document.body.style.overflow = '';
    overlay.remove();
  }, 1550);
})();
</script>

</body>
</html>
