<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>תורנות כיתה</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#185FA5">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --page:#F4F3EF;
  --card:#FFFFFF;
  --line:#E4E2DC;
  --text:#1F2421;
  --muted:#6F7471;
  --blue-bg:#E6F1FB;
  --blue:#0C447C;
  --blue-strong:#185FA5;
  --soft:#F1EFE8;
  --amber-bg:#FAEEDA;
  --amber:#633806;
  --red:#A32D2D;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--page);color:var(--text);
  font-family:'Assistant',system-ui,sans-serif;font-size:17px;line-height:1.5;
}
.wrap{max-width:440px;margin:0 auto;padding:16px 16px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}

.date{text-align:center;font-size:17px;font-weight:600;margin:0 0 2px}
.stamp{text-align:center;color:var(--muted);font-size:13px;margin:0 0 12px}
.publish{width:100%;margin-top:8px;background:#1D7A4E;border-color:#1D7A4E;color:#fff}
.pubinfo{text-align:center;color:var(--muted);font-size:13px;margin:6px 0 0}
.pubinfo.ok{color:#1D7A4E;font-weight:600}

.today{background:var(--blue-bg);color:var(--blue);border-radius:14px;padding:20px 16px;text-align:center}
.today .label{font-size:14px;font-weight:600;margin:0}
.today .name{font-size:clamp(28px,8vw,34px);font-weight:800;line-height:1.15;margin:6px 0}
.today .when{font-size:13px;margin:0}
.today.off{background:var(--amber-bg);color:var(--amber)}

.next{background:var(--soft);border-radius:10px;padding:11px 14px;display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.next span{font-size:14px;color:var(--muted)}
.next strong{font-size:16px}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
button{font-family:inherit;font-size:16px;font-weight:600;cursor:pointer;border-radius:10px;border:1px solid #C9C6BE;background:#fff;color:var(--text);min-height:50px;padding:0 10px;transition:transform .08s ease}
button:active{transform:scale(.97)}
button:disabled{opacity:.5;cursor:default}
button.primary{background:var(--blue-strong);border-color:var(--blue-strong);color:#fff}

h2{font-size:14px;font-weight:600;color:var(--muted);margin:22px 0 4px}
.row{display:flex;justify-content:space-between;padding:8px 2px;border-bottom:1px solid var(--line);font-size:16px}
.row:last-child{border-bottom:none}
.row.me{font-weight:800;color:var(--blue)}
.row b{font-weight:600;min-width:24px;text-align:left}

.status{text-align:center;color:var(--muted);font-size:15px;padding:30px 0}
.status.err{color:var(--red)}
.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:14px}

.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet[hidden]{display:none}
.sheet .box{background:#fff;width:100%;max-width:440px;border-radius:18px 18px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
.sheet h3{margin:0;font-size:19px}
.sheet p{margin:4px 0 14px;color:var(--muted);font-size:14px}
.sheet select,.sheet input{width:100%;height:48px;font-family:inherit;font-size:17px;border:1px solid #C9C6BE;border-radius:10px;padding:0 12px;background:#fff;margin-bottom:12px}
.sheet .btns{display:grid;grid-template-columns:2fr 1fr;gap:8px}
.sheet .msg{color:var(--red);font-size:14px;min-height:20px;margin:-6px 0 8px}
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="main">
    <div class="status" id="status">טוען…</div>
  </div>
  <div class="foot" id="foot"></div>
</div>

<div class="sheet" id="swapSheet" hidden>
  <div class="box">
    <h3 id="swapTitle">מי מחליף?</h3>
    <p id="swapSub"></p>
    <select id="swapSelect"></select>
    <div class="msg" id="swapMsg"></div>
    <div class="btns">
      <button class="primary" id="swapOk">אישור</button>
      <button data-close>ביטול</button>
    </div>
  </div>
</div>

<div class="sheet" id="offSheet" hidden>
  <div class="box">
    <h3>היום אין תורנות</h3>
    <p>התורן של היום יעבור ליום התורנות הבא.</p>
    <input id="offReason" placeholder="למה? למשל: טיול" maxlength="40">
    <div class="msg" id="offMsg"></div>
    <div class="btns">
      <button class="primary" id="offOk">אישור</button>
      <button data-close>ביטול</button>
    </div>
  </div>
</div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbyhIkiWWWAqlniCTgua_yM9cE0cwFRACp8rF3Zb76zSrYVx4O5unMdCcJNfE1XjoPgh/exec';
const KEY = 'tor-9k4m2xq7';
const EDIT = new URLSearchParams(location.search).get('edit') === '1';

let data = null;
let busy = false;
let justPublished = false;

function call(action, extra) {
  return new Promise(function (resolve, reject) {
    const cb = 'cb' + Date.now() + Math.floor(Math.random() * 1000);
    const p = new URLSearchParams(Object.assign({ key: KEY, action: action, callback: cb }, extra || {}));
    const s = document.createElement('script');
    const timer = setTimeout(function () { done(); reject(new Error('אין תשובה מהשרת')); }, 30000);
    function done() { clearTimeout(timer); delete window[cb]; s.remove(); }
    window[cb] = function (res) {
      done();
      if (res && res.ok) resolve(res); else reject(new Error((res && res.error) || 'שגיאה'));
    };
    s.onerror = function () { done(); reject(new Error('בעיית חיבור')); };
    s.src = API + '?' + p.toString();
    document.body.appendChild(s);
  });
}

/* "אלקובי ינון" -> "ינון אלקובי" */
function display(name) {
  const parts = String(name).trim().split(/\s+/);
  if (parts.length < 2) return name;
  const n = (parts[0] === 'בן' && parts.length > 2) ? 2 : 1;
  return parts.slice(n).join(' ') + ' ' + parts.slice(0, n).join(' ');
}

function esc(t) {
  return String(t).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function active() {
  return data.students.filter(function (s) { return s.active; }).sort(function (a, b) {
    return a.done - b.done || display(a.name).localeCompare(display(b.name), 'he');
  });
}

function render() {
  const d = data;
  let h = '<p class="date">תורנות כיתה · יום ' + esc(d.dayName) + ', ' + esc(d.date) + '</p>';
  if (!EDIT) {
    h += '<p class="stamp">' + (d.publishedAt ? 'פורסם ב־' + esc(d.publishedAt) : '&nbsp;') + '</p>';
  } else {
    h += '<p class="stamp">מצב עריכה · השינויים יופיעו לכולם רק אחרי "פרסם"</p>';
  }

  if (d.off) {
    h += '<div class="today off"><p class="label">היום אין תורנות</p>' +
         '<div class="name" style="font-size:22px">' + esc(d.offReason || '') + '</div></div>';
  } else if (d.current) {
    h += '<div class="today"><p class="label">תורן היום</p>' +
         '<div class="name">' + esc(display(d.current.name)) + '</div>' +
         '<p class="when">מהצהריים עד הערב</p></div>';
  } else {
    h += '<div class="today off"><p class="label">אין תלמיד זמין</p></div>';
  }

  if (d.next) {
    const label = d.next.isTomorrow ? 'מחר' : 'יום ' + d.next.dayName + ' ' + d.next.date.replace(/\.\d{4}$/, '');
    h += '<div class="next"><span>' + esc(label) + '</span><strong>' + esc(display(d.next.name)) + '</strong></div>';
  }

  if (EDIT && !d.off && d.current) {
    h += '<div class="actions">' +
         '<button id="btnSwap">🔄 החלפת תורן</button>' +
         '<button id="btnOff">🚫 היום אין תורנות</button></div>';
  }

  if (EDIT) {
    h += '<button class="publish" id="btnPub">📢 פרסם</button>' +
         '<p class="pubinfo' + (justPublished ? ' ok' : '') + '" id="pubInfo">' +
         (justPublished ? '✓ פורסם עכשיו' : (d.publishedAt ? 'פורסם לאחרונה: ' + esc(d.publishedAt) : 'עוד לא פורסם')) + '</p>';
  }

  h += '<h2>כמה כל אחד עשה</h2>';
  const cur = d.current && !d.off ? d.current.name : '';
  active().forEach(function (s) {
    h += '<div class="row' + (s.name === cur ? ' me' : '') + '"><span>' + esc(display(s.name)) +
         '</span><b>' + s.done + '</b></div>';
  });

  document.getElementById('main').innerHTML = h;
  document.getElementById('foot').textContent = EDIT ? 'מצב אחראי' : '';

  const bs = document.getElementById('btnSwap');
  if (bs) bs.onclick = openSwap;
  const bo = document.getElementById('btnOff');
  if (bo) bo.onclick = openOff;
  const bp = document.getElementById('btnPub');
  if (bp) bp.onclick = publish;
}

async function publish() {
  if (busy) return;
  const btn = document.getElementById('btnPub');
  const info = document.getElementById('pubInfo');
  busy = true;
  btn.disabled = true;
  btn.textContent = 'מפרסם…';
  try {
    data = await call('publish');
    justPublished = true;
    render();
  } catch (e) {
    info.textContent = e.message;
    info.className = 'pubinfo';
    btn.disabled = false;
    btn.textContent = '📢 פרסם';
  } finally {
    busy = false;
  }
}

function openSwap() {
  const cur = data.current.name;
  document.getElementById('swapTitle').textContent = 'מי מחליף את ' + display(cur).split(' ')[0] + '?';
  document.getElementById('swapSub').textContent = display(cur) + ' יישאר ראשון בתור ולא ייחשב לו.';
  const sel = document.getElementById('swapSelect');
  sel.innerHTML = '<option value="">בחר תלמיד</option>' + active().filter(function (s) {
    return s.name !== cur;
  }).map(function (s) {
    return '<option value="' + esc(s.name) + '">' + esc(display(s.name)) + ' (' + s.done + ')</option>';
  }).join('');
  document.getElementById('swapMsg').textContent = '';
  document.getElementById('swapSheet').hidden = false;
}

function openOff() {
  document.getElementById('offReason').value = '';
  document.getElementById('offMsg').textContent = '';
  document.getElementById('offSheet').hidden = false;
}

function closeSheets() {
  document.querySelectorAll('.sheet').forEach(function (s) { s.hidden = true; });
}

async function act(btn, msgEl, action, extra) {
  if (busy) return;
  busy = true;
  btn.disabled = true;
  const old = btn.textContent;
  btn.textContent = 'שומר…';
  try {
    data = await call(action, extra);
    justPublished = false;
    closeSheets();
    render();
  } catch (e) {
    msgEl.textContent = e.message;
  } finally {
    busy = false;
    btn.disabled = false;
    btn.textContent = old;
  }
}

document.getElementById('swapOk').onclick = function () {
  const name = document.getElementById('swapSelect').value;
  const msg = document.getElementById('swapMsg');
  if (!name) { msg.textContent = 'בחר תלמיד קודם'; return; }
  act(this, msg, 'swap', { name: name });
};
document.getElementById('swapSelect').onchange = function () {
  document.getElementById('swapMsg').textContent = '';
};
document.getElementById('offOk').onclick = function () {
  const reason = document.getElementById('offReason').value.trim();
  act(this, document.getElementById('offMsg'), 'pause', { reason: reason || 'יום ללא תורנות' });
};
document.querySelectorAll('[data-close]').forEach(function (b) { b.onclick = closeSheets; });
document.querySelectorAll('.sheet').forEach(function (s) {
  s.addEventListener('click', function (e) { if (e.target === s && !busy) closeSheets(); });
});

async function load() {
  try {
    data = await call(EDIT ? 'state' : 'published');
    render();
  } catch (e) {
    document.getElementById('main').innerHTML =
      '<div class="status err">' + esc(e.message) + '<br><br><button onclick="location.reload()">נסה שוב</button></div>';
  }
}

document.addEventListener('visibilitychange', function () {
  if (!document.hidden && data && !busy) load();
});

load();

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
