<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>מושגים לבגרות בתיירות · רשימה ומשחקים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff8f3;--card:#fff;--soft:#f4ede6;--ink:#1e1b17;--mute:#5b5850;--line:#e6ddd3;--olive:#3e4d34;--olive-d:#28361f;--olive-s:#e3ead9;--rust:#9e4225;--rust-s:#f6e1d8;--ok:#2f6b3a;--bad:#a8321f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Heebo,Arial,sans-serif;line-height:1.55}
a{color:inherit}
button{font:inherit;cursor:pointer}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px}
header.top{background:#fff;border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.logo{width:36px;height:36px;border-radius:9px;background:var(--olive);display:grid;place-items:center;color:#fff;font-family:"Frank Ruhl Libre",serif;font-weight:900;font-size:19px;flex:none;text-decoration:none}
.brand b{display:block;font-family:"Frank Ruhl Libre",serif;font-size:18px;line-height:1.2}
.brand span{font-size:13px;color:var(--mute)}
.back{margin-inline-start:auto;font-size:14px;text-decoration:none;color:var(--olive-d);border:1px solid var(--line);border-radius:999px;padding:5px 12px;background:var(--soft)}
h1{font-family:"Frank Ruhl Libre",serif;font-weight:900;font-size:clamp(30px,5vw,44px);color:var(--olive-d);margin:22px 0 4px;line-height:1.1}
.sub{color:var(--mute);margin:0 0 16px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;font-weight:500}
.tabs button.on{background:var(--olive-d);color:#fff;border-color:var(--olive-d)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:16px}
.filters select,.filters input[type=search]{font:inherit;border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:6px 12px}
.filters input[type=search]{flex:1;min-width:160px}
.filters label{font-size:14px;display:flex;gap:5px;align-items:center;white-space:nowrap}
.count{font-size:13px;color:var(--mute);margin-inline-start:auto}
/* list */
.grp{font-family:"Frank Ruhl Libre",serif;font-size:21px;color:var(--rust);margin:22px 0 8px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.c{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.c .h{display:flex;gap:8px;align-items:baseline}
.c .n{font-size:12px;color:var(--mute);min-width:22px}
.c .t{font-weight:700;font-size:18px}
.c .en{font-size:12px;color:var(--mute);direction:ltr;text-align:right}
.c .d{margin:0}
.c .e{margin:0;font-size:14px;color:var(--mute)}
.c .e b{color:var(--olive)}
.c .ft{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:4px;font-size:12px}
.tag{border-radius:999px;padding:1px 9px;background:var(--olive-s);color:var(--olive-d);font-weight:500}
.tag.r{background:var(--rust-s);color:var(--rust)}
.c .ft a{margin-inline-start:auto;color:var(--olive);text-decoration:none;border:1px solid var(--olive);border-radius:999px;padding:1px 10px}
.c.hide .d,.c.hide .e{filter:blur(6px);cursor:pointer;user-select:none}
.c.hide.show .d,.c.hide.show .e{filter:none}
.known{font-size:11px;color:var(--ok)}
/* panels */
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;text-align:center}
.big{font-family:"Frank Ruhl Libre",serif;font-weight:900;font-size:clamp(26px,5vw,38px);color:var(--olive-d);line-height:1.2;margin:8px 0}
.muted{color:var(--mute);font-size:14px}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.b{border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:9px 16px;font-weight:500}
.b.p{background:var(--olive-d);color:#fff;border-color:var(--olive-d)}
.b.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.b.no{background:var(--rust);color:#fff;border-color:var(--rust)}
/* flashcard */
.flip{perspective:1000px;max-width:560px;margin:0 auto;cursor:pointer}
.flip .in{position:relative;min-height:240px;transition:transform .45s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f{position:absolute;inset:0;backface-visibility:hidden;border:1px solid var(--line);border-radius:16px;background:var(--soft);display:flex;flex-direction:column;justify-content:center;padding:18px}
.flip .bk{transform:rotateY(180deg);background:#fff}
.bar{height:6px;background:var(--soft);border-radius:9px;overflow:hidden;margin:10px auto;max-width:560px}
.bar i{display:block;height:100%;background:var(--olive)}
/* match */
.mgrid{display:grid;grid-template-columns:1fr 1.6fr;gap:10px;text-align:right}
.mcol{display:flex;flex-direction:column;gap:8px}
.mi{border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:9px 12px;text-align:right;font-size:15px;transition:.15s}
.mi.t{font-weight:700}
.mi.sel{outline:3px solid var(--olive);background:var(--olive-s)}
.mi.done{background:#cfe5cf;border-color:var(--ok);color:#2f6b3a;cursor:default;opacity:.75}
.mi.wrong{animation:sh .35s;background:var(--rust-s)}
@keyframes sh{25%{transform:translateX(5px)}75%{transform:translateX(-5px)}}
/* quiz */
.q{max-width:640px;margin:0 auto;text-align:right}
.q .opts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.q .opt{border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:10px 14px;text-align:right}
.q .opt.ok{background:#dfeedd;border-color:var(--ok)}
.q .opt.no{background:var(--rust-s);border-color:var(--bad)}
.q .why{margin-top:10px;font-size:14px;color:var(--mute)}
.q .why a{color:var(--olive)}
.ans{font:inherit;width:100%;max-width:420px;border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--soft);text-align:center;font-size:18px}
footer{color:var(--mute);font-size:13px;padding:30px 0}
@media (max-width:640px){.mgrid{grid-template-columns:1fr 1.3fr}.mi{font-size:13px;padding:8px}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="logo" href="../">ת</a>
  <div class="brand"><b>חומרי הבגרות בתיירות</b><span>מושגים לבגרות</span></div>
  <a class="back" href="../marketing/11/">למצגת המושגים ←</a>
</div></header>

<main class="wrap">
  <h1>מושגים לבגרות</h1>
  <p class="sub">כל מושגי רשימת 2026, ועוד מושגים שנשאלו בשנים קודמות. פירוש, דוגמה, באילו שנים נשאל, וקישור לשקף שבו לומדים.</p>

  <nav class="tabs" id="tabs">
    <button data-m="list" class="on">רשימה</button>
    <button data-m="cards">כרטיסיות</button>
    <button data-m="match">משחק התאמה</button>
    <button data-m="quiz">חידון</button>
    <button data-m="write">מה המושג?</button>
  </nav>

  <div class="filters">
    <select id="fg"><option value="">כל הנושאים</option></select>
    <input type="search" id="fs" placeholder="חיפוש מושג…">
    <label><input type="checkbox" id="fa"> רק מה שנשאל בבגרות</label>
    <label><input type="checkbox" id="fu"> רק מה שעוד לא יודע</label>
    <label id="fhw"><input type="checkbox" id="fh"> להסתיר פירוש (בוחן עצמי)</label>
    <span class="count" id="cnt"></span>
  </div>

  <div id="view"></div>
</main>
<footer class="wrap">ההגדרות נכתבו לפי השקפים באתר וקובץ "מושגים לבגרות 2026". אתר עזר ללמידה — לא אתר רשמי של משרד החינוך.</footer>

<script>
(function(){
// ---- data & state ----
var DATA=null, mode='list';
var KEY='tayarut-concepts-known';
var known={};
try{known=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
function saveKnown(){try{localStorage.setItem(KEY,JSON.stringify(known))}catch(e){}}
var $=function(id){return document.getElementById(id)};
var view=$('view');
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function mask(it){var w=it.t.split(/\s*\/\s*/).filter(function(x){return x.length>2});var d=it.d;w.forEach(function(x){d=d.split(x).join('___')});return d}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function slideUrl(l){var p=l.split('#');return '../'+p[0]+'/#'+p[1]}

function pool(){
  var g=$('fg').value, q=$('fs').value.trim(), a=$('fa').checked, u=$('fu').checked;
  return DATA.items.filter(function(it){
    if(g!==''&&String(it.g)!==g) return false;
    if(a&&!it.y.length) return false;
    if(u&&known[it.id]) return false;
    if(q&&(it.t+' '+it.en+' '+it.d+' '+it.e).indexOf(q)<0) return false;
    return true;
  });
}
function need(n,p){
  if(p.length>=n) return true;
  view.innerHTML='<div class="panel"><p class="big">אין מספיק מושגים</p><p class="muted">צריך לפחות '+n+' מושגים. שנו את הסינון למעלה.</p></div>';
  return false;
}

// ---- list ----
function cardHtml(it,hide){
  var y=it.y.length?'<span class="tag">נשאל: '+it.y.join(', ')+'</span>':'<span class="tag r">עוד לא נשאל</span>';
  if(!it.list) y+='<span class="tag r">לא במיקוד 2026</span>';
  return '<div class="c'+(hide?' hide':'')+'">'+
   '<div class="h"><span class="n">'+(it.list?it.id:'')+'</span><span class="t">'+esc(it.t)+'</span>'+(known[it.id]?'<span class="known">✓ יודע</span>':'')+'</div>'+
   (it.en?'<div class="en">'+esc(it.en)+'</div>':'')+
   '<p class="d">'+esc(it.d)+'</p><p class="e"><b>דוגמה:</b> '+esc(it.e)+'</p>'+
   '<div class="ft">'+y+'<a href="'+slideUrl(it.l)+'">'+esc(it.ll)+' ←</a></div></div>';
}
function renderList(){
  var p=pool(), hide=$('fh').checked, h='', last=-1;
  p.forEach(function(it){
    if(it.g!==last){ if(last!==-1) h+='</div>'; h+='<h2 class="grp">'+esc(DATA.groups[it.g])+'</h2><div class="cards">'; last=it.g; }
    h+=cardHtml(it,hide);
  });
  if(last!==-1) h+='</div>';
  view.innerHTML=h||'<div class="panel"><p class="muted">לא נמצאו מושגים.</p></div>';
  view.querySelectorAll('.c.hide').forEach(function(c){c.onclick=function(){c.classList.toggle('show')}});
}

// ---- flashcards ----
var fc={list:[],i:0,back:false};
function startCards(){fc.list=shuffle(pool());fc.i=0;renderCards()}
function renderCards(){
  if(!need(1,fc.list)) return;
  if(fc.i>=fc.list.length){
    var k=fc.list.filter(function(x){return known[x.id]}).length;
    view.innerHTML='<div class="panel"><p class="big">סיימתם את החבילה</p><p class="muted">'+k+' מתוך '+fc.list.length+' מסומנים "יודע".</p><div class="row"><button class="b p" id="again">עוד סבב</button></div></div>';
    $('again').onclick=startCards; return;
  }
  var it=fc.list[fc.i], pr=Math.round(fc.i/fc.list.length*100);
  view.innerHTML='<div class="muted" style="text-align:center">'+(fc.i+1)+' / '+fc.list.length+' · לחצו על הכרטיס כדי להפוך</div>'+
   '<div class="bar"><i style="width:'+pr+'%"></i></div>'+
   '<div class="flip" id="fl"><div class="in"><div class="f"><div class="muted">'+esc(DATA.groups[it.g])+'</div><div class="big">'+esc(it.t)+'</div>'+(it.en?'<div class="muted" dir="ltr">'+esc(it.en)+'</div>':'')+'</div>'+
   '<div class="f bk"><p style="font-size:18px;margin:0 0 8px">'+esc(it.d)+'</p><p class="muted" style="margin:0"><b>דוגמה:</b> '+esc(it.e)+'</p></div></div></div>'+
   '<div class="row"><button class="b no" id="no">עוד לא יודע</button><button class="b ok" id="yes">יודע ✓</button></div>';
  $('fl').onclick=function(){this.classList.toggle('on')};
  $('yes').onclick=function(){known[it.id]=1;saveKnown();fc.i++;renderCards()};
  $('no').onclick=function(){delete known[it.id];saveKnown();fc.i++;renderCards()};
}

// ---- match ----
var mt={};
function startMatch(){
  var p=pool(); if(!need(4,p)) return;
  mt={set:shuffle(p).slice(0,6),done:0,miss:0,sel:null,t0:Date.now()};
  var terms=shuffle(mt.set), defs=shuffle(mt.set);
  view.innerHTML='<div class="panel"><p class="muted">בחרו מושג, ואז את הפירוש שלו.</p><div class="mgrid"><div class="mcol" id="mt"></div><div class="mcol" id="md"></div></div><div class="row" id="mres"></div></div>';
  terms.forEach(function(it){var b=document.createElement('button');b.className='mi t';b.textContent=it.t;b.dataset.id=it.id;b.dataset.k='t';$('mt').appendChild(b)});
  defs.forEach(function(it){var b=document.createElement('button');b.className='mi';b.textContent=mask(it);b.dataset.id=it.id;b.dataset.k='d';$('md').appendChild(b)});
  view.querySelectorAll('.mi').forEach(function(b){b.onclick=function(){matchClick(b)}});
}
function matchClick(b){
  if(b.classList.contains('done')) return;
  if(!mt.sel||mt.sel.dataset.k===b.dataset.k){ if(mt.sel) mt.sel.classList.remove('sel'); mt.sel=b; b.classList.add('sel'); return; }
  var a=mt.sel; a.classList.remove('sel'); mt.sel=null;
  if(a.dataset.id===b.dataset.id){ a.classList.add('done'); b.classList.add('done'); mt.done++;
    if(mt.done===mt.set.length){ var s=Math.round((Date.now()-mt.t0)/1000);
      $('mres').innerHTML='<p class="big" style="width:100%">כל הכבוד!</p><p class="muted" style="width:100%">'+s+' שניות · '+mt.miss+' טעויות</p><button class="b p" id="mag">סבב חדש</button>';
      $('mag').onclick=startMatch; }
  } else { mt.miss++; [a,b].forEach(function(x){x.classList.add('wrong');setTimeout(function(){x.classList.remove('wrong')},400)}); }
}

// ---- quiz ----
var qz={};
function startQuiz(){
  var p=pool(); if(!need(4,p)) return;
  qz={qs:shuffle(p).slice(0,10),i:0,score:0,wrong:[]}; renderQuiz();
}
function distract(it,k){
  var same=DATA.items.filter(function(x){return x.id!==it.id&&x.g===it.g});
  var other=DATA.items.filter(function(x){return x.id!==it.id&&x.g!==it.g});
  var c=shuffle(same).concat(shuffle(other)); return c.slice(0,k);
}
function renderQuiz(){
  if(qz.i>=qz.qs.length){
    var w=qz.wrong.map(function(it){return cardHtml(it,false)}).join('');
    view.innerHTML='<div class="panel"><p class="big">'+qz.score+' / '+qz.qs.length+'</p><p class="muted">'+(qz.score===qz.qs.length?'מושלם!':'כדאי לחזור על המושגים שלמטה.')+'</p><div class="row"><button class="b p" id="qag">חידון חדש</button></div></div>'+(w?'<h2 class="grp">לחזור עליהם</h2><div class="cards">'+w+'</div>':'');
    $('qag').onclick=startQuiz; return;
  }
  var it=qz.qs[qz.i], dir=Math.random()<.5, opts=shuffle([it].concat(distract(it,3)));
  var h='<div class="panel"><div class="q"><div class="muted">שאלה '+(qz.i+1)+' מתוך '+qz.qs.length+' · ניקוד: '+qz.score+'</div>';
  h+= dir ? '<p class="muted" style="margin:10px 0 0">מה הפירוש של המושג:</p><div class="big">'+esc(it.t)+'</div>'
          : '<p class="muted" style="margin:10px 0 0">לאיזה מושג מתאים הפירוש?</p><p style="font-size:19px;font-weight:500;margin:6px 0">'+esc(mask(it))+'</p>';
  h+='<div class="opts">'+opts.map(function(o){return '<button class="opt" data-id="'+o.id+'">'+esc(dir?mask(o):o.t)+'</button>'}).join('')+'</div><div id="qw"></div></div></div>';
  view.innerHTML=h;
  view.querySelectorAll('.opt').forEach(function(b){b.onclick=function(){
    if(view.querySelector('.opt.ok')) return;
    var right=String(it.id)===b.dataset.id;
    view.querySelectorAll('.opt').forEach(function(x){if(x.dataset.id===String(it.id))x.classList.add('ok')});
    if(right){qz.score++;known[it.id]=1}else{b.classList.add('no');qz.wrong.push(it);delete known[it.id]} saveKnown();
    $('qw').innerHTML='<div class="why"><b>'+esc(it.t)+':</b> '+esc(it.d)+' <b>דוגמה:</b> '+esc(it.e)+' · <a href="'+slideUrl(it.l)+'">'+esc(it.ll)+'</a></div><div class="row"><button class="b p" id="qn">הבא ←</button></div>';
    $('qn').onclick=function(){qz.i++;renderQuiz()};
  }});
}

// ---- write the term ----
var wr={};
function norm(s){return s.replace(/["'׳״\-־\s()]/g,'').replace(/^ה/,'').toLowerCase()}
function startWrite(){var p=pool(); if(!need(1,p)) return; wr={qs:shuffle(p).slice(0,10),i:0,score:0}; renderWrite()}
function renderWrite(){
  if(wr.i>=wr.qs.length){view.innerHTML='<div class="panel"><p class="big">'+wr.score+' / '+wr.qs.length+'</p><div class="row"><button class="b p" id="wag">עוד סבב</button></div></div>';$('wag').onclick=startWrite;return}
  var it=wr.qs[wr.i];
  view.innerHTML='<div class="panel"><div class="muted">'+(wr.i+1)+' / '+wr.qs.length+' · ניקוד: '+wr.score+'</div><p style="font-size:19px;font-weight:500">'+esc(mask(it))+'</p><p class="muted">רמז: '+it.t.length+' תווים, מתחיל ב־"'+esc(it.t.charAt(0))+'"</p>'+
    '<input class="ans" id="wa" autocomplete="off" placeholder="כתבו את המושג"><div class="row"><button class="b p" id="wc">בדיקה</button><button class="b" id="ws">דלג</button></div><div id="wf"></div></div>';
  var inp=$('wa'); inp.focus();
  function next(){wr.i++;renderWrite()}
  function check(skip){
    var ok=!skip&&norm(inp.value)===norm(it.t);
    if(ok){wr.score++;known[it.id]=1;saveKnown()}
    $('wf').innerHTML='<p class="big" style="color:'+(ok?'var(--ok)':'var(--rust)')+'">'+(ok?'נכון!':esc(it.t))+'</p><div class="row"><button class="b p" id="wn">הבא ←</button></div>';
    $('wc').disabled=$('ws').disabled=true; inp.disabled=true; $('wn').onclick=next; $('wn').focus();
  }
  $('wc').onclick=function(){check(false)}; $('ws').onclick=function(){check(true)};
  inp.onkeydown=function(e){if(e.key==='Enter')check(false)};
}

// ---- router ----
var R={list:renderList,cards:startCards,match:startMatch,quiz:startQuiz,write:startWrite};
function go(m){mode=m;
  document.querySelectorAll('#tabs button').forEach(function(b){b.classList.toggle('on',b.dataset.m===m)});
  $('fhw').style.display=m==='list'?'':'none';
  try{history.replaceState(null,'','#'+m)}catch(e){}
  R[m]();}
function refresh(){ $('cnt').textContent=pool().length+' מושגים'; R[mode](); }

fetch('concepts.json?v=1').then(function(r){return r.json()}).then(function(d){
  DATA=d;
  d.groups.forEach(function(g,i){var o=document.createElement('option');o.value=i;o.textContent=g;$('fg').appendChild(o)});
  ['fg','fa','fu','fh'].forEach(function(id){$(id).onchange=refresh});
  $('fs').oninput=refresh;
  document.querySelectorAll('#tabs button').forEach(function(b){b.onclick=function(){go(b.dataset.m)}});
  var h=location.hash.slice(1); $('cnt').textContent=pool().length+' מושגים'; go(R[h]?h:'list');
}).catch(function(){view.innerHTML='<div class="panel"><p class="muted">לא הצלחנו לטעון את המושגים. נסו לרענן.</p></div>'});
})();
</script>
</body>
</html>
