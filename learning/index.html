<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>כיתה פלוס — חומרי לימוד</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1E90FF">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;800&family=Secular+One&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --blue: #1E90FF; --admin: #8B5CF6; --admin-light: #6D28D9;
      --dark: #FFF8ED; --dark2: #FFFFFF; --dark3: #FFEFD9;
      --text: #1B2A3D; --muted: #6C7A8C;
      --font-display: 'Secular One', 'Heebo', sans-serif;
    }
    body { font-family: 'Heebo', sans-serif; background: var(--dark); color: var(--text); min-height: 100vh; }
    .wrap { max-width: 720px; margin: 0 auto; padding: 40px 24px; }
    .logo { text-align: center; margin-bottom: 28px; }
    .logo-mark { display: inline-flex; align-items: center; justify-content: center; width: 56px; height: 56px; background: linear-gradient(135deg, var(--blue), var(--admin)); border-radius: 16px; margin-bottom: 12px; }
    .logo h1 { font-family: var(--font-display); font-size: 26px; font-weight: 400; background: linear-gradient(135deg, var(--blue), var(--admin-light)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .logo p { font-size: 13px; color: var(--muted); margin-top: 6px; }
    .card { background: var(--dark2); border: 1px solid rgba(27,42,61,0.08); border-radius: 22px; padding: 28px; box-shadow: 0 24px 60px rgba(27,42,61,0.10); text-align: center; }
    .card p { color: var(--muted); font-size: 14px; line-height: 1.7; }
    .back { display: block; text-align: center; margin-top: 20px; font-size: 13px; color: var(--blue); text-decoration: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">
      <div class="logo-mark"></div>
      <h1>חומרי לימוד</h1>
      <p>סיכומים, מדריכים ושאלות תרגול שהופקו מחומרי הקורס</p>
    </div>
    <div class="card">
      <p>המקטע הזה בבנייה. חומרי הלימוד יופיעו כאן ברגע שיתווספו.</p>
    </div>
    <a class="back" href="/">חזרה לדף הכניסה</a>
  </div>
</body>
</html>
