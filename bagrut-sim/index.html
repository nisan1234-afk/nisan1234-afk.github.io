<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>סימולטור בגרות</title>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Arimo:wght@400;700&display=swap" rel="stylesheet">
<style>
/* VOICE: exam-room neutral, nothing added beyond the player itself
   IDEA: pixel-match of the computerized bagrut player (measured tokens below), own branding only
   PICTURE: the working exam screen: 60px slate bar, 84px rail, 1024px sheet, lime question tag
   COLOUR and TYPE: #3A4A69 frame, #DDDFEB stage, #EDEFF8 panels, #C6D733 tag, #BAD104 marker, #0090E5 links; chrome in Assistant, exam text in Segoe UI/Arimo
   LAYOUT: fixed bar, right rail + drawer, centered sheet, side half-circle page arrows */
:root{--main:#3A4A69;--stage:#DDDFEB;--panel:#EDEFF8;--light-text:#D7E0F2;--tag:#C6D733;--lime:#BAD104;--link:#0090E5;--dark30:rgba(22,27,36,.3);--err:#E41B56;
--ui:Assistant,"Segoe UI",sans-serif;--exam:"Segoe UI",Arimo,Arial,sans-serif}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%}
body{background:#DDDDDD;color:#000;font:16px var(--ui);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--lime);outline-offset:1px}
/* ---- top bar ---- */
.top{position:fixed;inset:0 0 auto 0;height:60px;background:var(--main);display:flex;align-items:center;z-index:30}
.x{width:60px;height:60px;border:0;background:var(--main);color:#fff;display:grid;place-items:center;flex:none}
.x svg{width:26px;height:26px}
.mid{flex:1;display:flex;align-items:center;justify-content:flex-end;gap:12px;padding-inline-end:357px}
.circ{width:38px;height:38px;border-radius:38px;border:0;background:var(--dark30);color:#fff;display:grid;place-items:center;font:700 17px/1 var(--ui)}
.circ i{font-style:italic;font-size:15px;font-weight:400}
.clock{height:38px;border-radius:38px;background:var(--dark30);color:var(--light-text);padding:0 14px;display:flex;align-items:center;gap:6px;font:600 15px var(--ui);direction:ltr}
.clock.warn{background:var(--err);color:#fff}
.saved{color:var(--light-text);font-size:13px;opacity:.75}
.det{text-align:right;color:var(--light-text);padding-inline-start:12px;line-height:1.3}
.det b{display:block;font:700 16px/21px var(--ui)}
.det span{font-size:14px;line-height:18px;display:flex;gap:4px;align-items:center;justify-content:flex-start}
.det svg{width:12px;height:12px}
.logo{width:56px;height:50px;margin:0 14px 0 6px;flex:none}
/* ---- rail ---- */
.rail{position:fixed;top:60px;right:0;bottom:0;width:84px;background:var(--panel);z-index:25}
.rail .cap{height:70px;background:var(--main);border-bottom-left-radius:7px}
.rbtn{display:grid;justify-items:center;align-content:center;gap:8px;width:84px;height:70px;border:0;background:var(--main);color:var(--light-text);font:700 14px/14px var(--ui);position:relative}
.rbtn svg{width:24px;height:24px}
.rbtn.on{background:var(--panel);color:var(--main)}
.rbtn.on::after{content:"";position:absolute;right:0;top:0;bottom:0;width:6px;background:var(--lime)}
.rail .rest{position:absolute;top:140px;bottom:0;left:0;right:0;background:var(--main);border-top-left-radius:7px}
.rail .rest .rbtn{background:transparent}
.rail .gap{height:0}
/* ---- stage ---- */
.stage{position:fixed;top:60px;right:84px;left:0;bottom:0;background:var(--stage);border-top-left-radius:7px;overflow:hidden}
.scroll{position:absolute;inset:0;overflow-y:auto;padding:50px 0 60px}
.sheet{width:min(1024px,calc(100% - 220px));margin:0 auto;background:#fff;border-radius:3px;box-shadow:0 1px 3px rgba(58,74,105,.15);font:16.1px/1.4 var(--exam)}
.sh{background:var(--panel);border-radius:3px 3px 0 0;padding:20px 30px 15px 20px;font-size:18px;line-height:24px;position:sticky;top:-50px;z-index:3;border-bottom:1px solid #dfe2ee}
.qt{padding:30px}
.topline{border-top:1px solid var(--tag);margin-top:22px}
.numq{display:inline-block;background:var(--tag);font:700 17.7px/22px var(--exam);padding:5px 10px;border-radius:0 0 10px 10px}
.sec{display:grid;grid-template-columns:27px minmax(0,1fr);margin:24px 0}
.sec>b{font-size:18.5px;color:#4d4d4d}
.nik{font-size:12.9px;margin-top:2px}
.map{position:relative;width:551px;max-width:100%;margin:24px auto 18px;aspect-ratio:551/510}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.cz{position:absolute;width:98px;height:21px;background:#e5e5e5;border:2px inset #767676;font:13.3px Arial;color:#545454;padding:1px 2px}
.cz:focus{background:#fff;color:#000;outline:2px solid var(--lime)}
.tw{display:block;background:#e2e2e2;border:1px solid #e2e2e2;padding:10px;margin-top:8px}
.tw textarea{display:block;width:80%;min-height:81px;border:1px solid #767676;background:#fff;font:13.3px monospace;padding:2px;resize:vertical}
.cnt{font:12px var(--ui);color:#555;margin-top:4px}
table.t{border-collapse:collapse;width:100%;margin-top:12px}
.t th,.t td{border:1px solid #000;padding:6px;vertical-align:middle}
.t th{font-weight:400;text-align:center}
.t td.pic{width:200px}
.thumb{border:0;padding:0;background:none;width:100%;display:block}
.thumb svg{width:100%;height:auto;display:block}
.credit{font-size:11.5px;line-height:1.3}
.t select{font:13.3px Arial;border:1px solid #767676;background:#fff;width:156px;max-width:100%}
.t .tw textarea{width:100%}
/* gate */
.gate .sh{position:static;padding:40px 40px 0;border:0;display:grid;grid-template-columns:1fr auto;gap:20px;color:var(--main)}
.gmeta{display:grid;grid-template-columns:auto auto;gap:4px 34px;font-size:14px;justify-self:end}
.gmeta dt{font-weight:700}.gmeta dd{margin:0}
.glabel{font-size:18px;line-height:1.2}.glabel small{display:block;font-size:14px}
.band{grid-column:1/-1;justify-self:center;width:540px;max-width:100%;background:var(--lime);font:29.4px var(--exam);text-align:center;padding:35px 0;margin-top:22px;transform:translateY(0)}
.gate .qt{color:var(--main);font-size:16.1px}
.gate h3{text-align:center;font:19.6px var(--exam);margin:6px 0 24px}
.gate ol{list-style:hebrew;padding-inline-start:28px;max-width:860px;margin:0 auto}
.gate li{margin:0 0 14px}
.disc{font:13px var(--ui);color:#6a7489;text-align:center;margin-top:26px}
/* side arrows */
.pg{position:fixed;top:calc(60px + (100vh - 60px)/2 - 131px);width:80px;height:262px;border:0;background:none;display:grid;place-items:center;z-index:4;color:#000}
.pg::before{content:"";position:absolute;top:0;width:262px;height:262px;border-radius:50%;background:rgba(255,255,255,.28);pointer-events:none}
.pg.prv{right:calc(84px + 42px)}.pg.prv::before{left:0}
.pg.nxt{left:56px}.pg.nxt::before{right:0}
.pg svg{width:22px;height:22px;position:relative}
.pg:disabled{visibility:hidden}
/* drawer */
.drawer{position:fixed;top:60px;right:84px;bottom:0;width:353px;background:var(--panel);z-index:20;transform:translateX(105%);visibility:hidden;transition:transform .22s ease,visibility .22s;overflow-y:auto;padding:0 25px 30px 25px;box-shadow:-6px 0 14px rgba(58,74,105,.12)}
.drawer.open{transform:none;visibility:visible}
.dh{display:flex;justify-content:space-between;align-items:center;height:56px;color:var(--main);font:700 18px var(--ui);padding-right:20px;margin-bottom:5px}
.dh button{width:38px;height:38px;border-radius:38px;border:0;background:none;color:var(--main);display:grid;place-items:center;margin-left:-16px}
.dh svg{width:14px;height:14px}
.db{display:block;width:268px;max-width:100%;height:36px;border:0;border-radius:3px;background:#fff;color:var(--link);font:700 18px var(--ui);text-align:right;padding:0 16px;position:relative}
.db.cur,.dq.cur{background:var(--main);color:#fff}
.db.cur::after,.dq.cur::after{content:"";position:absolute;right:-6px;top:0;bottom:0;width:6px;background:var(--lime);border-radius:0 3px 3px 0}
.dch{margin-top:40px}
.dct{display:flex;align-items:center;justify-content:flex-start;gap:10px;border:0;background:none;width:100%;padding:0;color:var(--main);font:700 18px var(--ui);height:24px}
.dct .nm{display:flex;align-items:center;gap:8px}
.dct svg{width:16px;height:16px;transition:transform .2s}
.dch.open .dct svg{transform:rotate(90deg)}
.pts{background:rgba(221,223,235,.6);border-radius:2px;font:400 14px var(--ui);padding:1px 6px}
.pts b{font-weight:700}
.dbody{display:none;padding-top:22px}
.dch.open .dbody{display:block}
.dd{color:var(--main);font:16px/21px var(--ui);opacity:.75;margin:0 0 2px;padding-right:0;max-width:268px}
.dq{display:block;width:238px;max-width:100%;margin:2px auto 0 0;margin-inline-start:27px;height:36px;border:0;border-radius:3px;background:rgba(255,255,255,.6);color:var(--link);font:700 14px var(--ui);text-align:right;padding:0 16px;position:relative}
.dq small{float:left;font-weight:400;opacity:.7}
.dnone{font:14px var(--ui);color:var(--main);opacity:.6;margin:6px 27px 0 0}
/* draft + modal + login */
.draft{position:fixed;left:24px;bottom:24px;width:360px;max-width:calc(100vw - 140px);background:#fff;border-radius:3px;box-shadow:0 4px 18px rgba(22,27,36,.3);z-index:22;display:none}
.draft.open{display:block}
.draft header{background:var(--main);color:#fff;font:700 15px var(--ui);padding:8px 12px;border-radius:3px 3px 0 0}
.draft textarea{width:100%;min-height:170px;border:0;padding:10px;font:14px var(--ui);resize:vertical;display:block}
.modal{position:fixed;inset:0;background:rgba(22,27,36,.6);display:none;place-items:center;z-index:40;padding:20px}
.modal.open{display:grid}
.mcard{background:#fff;border-radius:3px;width:min(720px,100%);padding:16px}
.mcard svg{width:100%;height:auto;display:block}
.btn{border:0;border-radius:3px;background:var(--main);color:#fff;font:700 16px var(--ui);min-height:40px;padding:0 24px}
.btn.l{background:var(--lime);color:#161B24}
.login{position:fixed;inset:0;background:var(--stage);display:grid;place-items:center;padding:16px;z-index:50}
.lcard{width:min(420px,100%);background:#fff;border-radius:3px;box-shadow:0 1px 3px rgba(58,74,105,.2)}
.lcard header{background:var(--main);color:var(--light-text);display:flex;align-items:center;gap:10px;padding:14px 18px;border-radius:3px 3px 0 0}
.lcard header b{font:700 18px var(--ui);color:#fff;display:block}
.lcard form{display:grid;gap:14px;padding:22px}
.lcard label{display:grid;gap:4px;color:var(--main);font-weight:700}
.lcard input{height:40px;border:1px solid #b9bfd3;border-radius:3px;padding:0 10px;font:16px var(--ui);color:#000}
.lerr{color:var(--err);min-height:20px;font-size:14px}
.sum td,.sum th{font:15px var(--ui);text-align:right}
.ok{color:#5c7a00;font-weight:700}.no{color:var(--err);font-weight:700}
body.big .sheet{font-size:19px}body.big .tw textarea,body.big .cz,body.big .t select{font-size:16px}
@media(max-width:900px){.mid{padding-inline-start:12px}.saved{display:none}.sheet{width:calc(100% - 24px)}.pg{top:auto;bottom:10px;height:56px;width:56px}.pg::before{display:none}.pg.prv{right:96px}.pg.nxt{left:12px}.pg svg{background:#fff;border-radius:50%;width:44px;height:44px;padding:11px;box-shadow:0 1px 4px #0003}}
@media(max-width:640px){.det b{font-size:14px;line-height:18px}.det span{display:none}.logo{display:none}.rail{width:64px}.rbtn{width:64px}.stage{right:64px}.drawer{right:64px;width:calc(100vw - 64px)}.qt{padding:16px}.sh{padding:14px 16px}
 .t,.t tbody,.t tr,.t td{display:block}.t thead{display:none}.t tr{border:1px solid #000;margin-bottom:10px}.t td{border:0}.t td.pic{width:auto}.gate .sh{grid-template-columns:1fr;padding:20px}.gmeta{justify-self:start}}
.fsb{display:flex;align-items:center;gap:6px;height:38px;border-radius:38px;border:0;background:var(--lime);color:#161B24;font:700 14px var(--ui);padding:0 14px;white-space:nowrap}
.fsb svg{width:16px;height:16px}
.emb-note{background:#fff7cc;color:#3a3000;font:14px var(--ui);padding:10px 14px;border-radius:3px;display:grid;gap:8px}
.emb-note .fsb{justify-self:start}
@media(max-width:1100px){.mid{padding-inline-end:12px}.sheet{width:calc(100% - 150px)}.pg{width:60px}.pg.prv{right:calc(84px + 8px)}.pg.nxt{left:8px}.pg::before{width:180px;height:180px;top:41px}.saved{display:none}.det b{font-size:14px}}
@media(prefers-reduced-motion:reduce){.drawer,.dct svg{transition:none}}
</style>
<link rel="stylesheet" href="extra.css">
</head>
<body>
<div id="app"></div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
